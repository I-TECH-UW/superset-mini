services:
  postgres:
    image: postgres:13
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-data}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - csim-net

networks:
  csim-net:
    external: true
